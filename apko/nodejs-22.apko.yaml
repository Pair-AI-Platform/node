# Node.js 22 runtime (maintenance LTS): distroless, so no shell and no package manager; runs as
# node (1000:1000). Packages are not pinned: every build takes the current Wolfi packages, and the
# release workflow publishes a new version only when the resulting image differs from the last one.
# Node.js 22 itself is nodejs-22-upstream, the official nodejs.org binaries built by
# melange/nodejs-22-upstream.yaml (see docs/NODE-SOURCES.md).
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - tzdata
    - nodejs-22-upstream

accounts:
  groups:
    - groupname: node
      gid: 1000
  users:
    - username: node
      uid: 1000
      gid: 1000
      shell: /sbin/nologin
  run-as: 1000

paths:
  - path: /app
    type: directory
    uid: 1000
    gid: 1000
    permissions: 0o755

work-dir: /app

entrypoint:
  command: /usr/bin/node

environment:
  PATH: /usr/sbin:/usr/bin:/sbin:/bin
  NODE_ENV: production
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

annotations:
  org.opencontainers.image.title: Node.js 22
  org.opencontainers.image.description: Node.js 22 runtime on Wolfi. Distroless, non-root.

archs:
  - x86_64
  - aarch64
