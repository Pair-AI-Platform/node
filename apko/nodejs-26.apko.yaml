# Node.js 26 runtime (current): with sh and bash shells; runs as
# node (1000:1000). Packages are not pinned: every build takes the current Wolfi packages, and the
# release workflow publishes a new version only when the resulting image differs from the last one.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - tzdata
    - nodejs-26
    - busybox
    - bash

accounts:
  groups:
    - groupname: node
      gid: 1000
  users:
    - username: node
      uid: 1000
      gid: 1000
      shell: /bin/bash
  run-as: 1000

paths:
  - path: /app
    type: directory
    uid: 1000
    gid: 1000
    permissions: 0o755

work-dir: /app

entrypoint:
  command: /usr/bin/node

environment:
  PATH: /usr/sbin:/usr/bin:/sbin:/bin
  NODE_ENV: production
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

annotations:
  org.opencontainers.image.title: Node.js 26
  org.opencontainers.image.description: Node.js 26 runtime on Wolfi with sh and bash. Non-root.

archs:
  - x86_64
  - aarch64
