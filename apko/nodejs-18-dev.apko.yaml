# Node.js 18 development (end of life (April 2025)): the runtime plus a shell, npm, yarn, pnpm, git and the
# C/C++ toolchain with Python for native modules (node-gyp). For building applications; ship them
# on the runtime image. Runs as node (1000:1000).
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - tzdata
    - nodejs-18
    - npm
    - yarn
    - pnpm
    - busybox
    - bash
    - git
    - build-base
    - python3

accounts:
  groups:
    - groupname: node
      gid: 1000
  users:
    - username: node
      uid: 1000
      gid: 1000
      shell: /bin/bash
  run-as: 1000

paths:
  - path: /app
    type: directory
    uid: 1000
    gid: 1000
    permissions: 0o755

work-dir: /app

entrypoint:
  command: /usr/bin/node

environment:
  PATH: /usr/sbin:/usr/bin:/sbin:/bin
  NODE_ENV: development
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

annotations:
  org.opencontainers.image.title: Node.js 18 (development)
  org.opencontainers.image.description: Node.js 18 on Wolfi with npm, yarn, pnpm, git and the build toolchain. Non-root.

archs:
  - x86_64
  - aarch64
