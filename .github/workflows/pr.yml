name: PR

# The checks every pull request needs before it merges, including Renovate's automerge: every image
# builds on both architectures, passes the image tests, and is scanned (STIG and vulnerabilities;
# the results are in the job summaries). Nothing is published.
on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # build.yml also holds the publish job, and GitHub refuses to start a called workflow whose jobs
  # declare more permissions than the caller grants, even for jobs that are skipped. publish: false
  # skips that job, so nothing here is pushed, signed or attested.
  build:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build.yml
    with:
      publish: false
    secrets: inherit
